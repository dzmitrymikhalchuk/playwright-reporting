name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-tests:
    timeout-minutes: 60
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Restore Allure history
      continue-on-error: true
      run: |
        rm -rf ./allure-results
        if git ls-remote --exit-code --heads origin gh-pages; then
          git fetch origin gh-pages --depth=1
          git checkout origin/gh-pages -- allure-history 2>/dev/null || echo "No history yet, starting fresh"
        else
          echo "gh-pages branch not found, skipping"
        fi

    - name: Run tests and generate report
      run: |
        set -o pipefail
        touch line-report.txt
        npx allure run -c ./allure.config.mjs -- playwright test 2>&1 | tee line-report.txt

    - name: Prepare GitHub Pages
      if: ${{ !cancelled() }}
      run: |
        mkdir -p pages
        cp -r allure-report pages/allure
        cp -r playwright-report pages/playwright
        cp line-report.txt pages/line.txt
        [ -d allure-history ] && cp -r allure-history pages/allure-history || true

    - name: Deploy to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./pages
        keep_files: false

    - name: Upload JUnit results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: junit-results
        path: test-results/results.xml

    - name: Upload line report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: line-report
        path: line-report.txt

  notify-slack:
    needs: [run-tests]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Download JUnit results
      uses: actions/download-artifact@v4
      with:
        name: junit-results
        path: test-results/

    - name: Send Slack notification
      env:
        CI: "true"
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        ALLURE_REPORT_URL: ${{ format('https://{0}.github.io/{1}/allure/', github.repository_owner, github.event.repository.name) }}
        PW_REPORT_URL: ${{ format('https://{0}.github.io/{1}/playwright/', github.repository_owner, github.event.repository.name) }}
        LINE_REPORT_URL: ${{ format('https://{0}.github.io/{1}/line.txt', github.repository_owner, github.event.repository.name) }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: npm run slack
