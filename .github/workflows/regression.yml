name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    timeout-minutes: 60
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run tests and generate report
      run: |
        set -o pipefail
        touch line-report.txt
        npm run test:ci 2>&1 | tee line-report.txt

    - name: Prepare GitHub Pages
      if: ${{ !cancelled() }}
      run: |
        mkdir -p pages
        cp -r allure-report pages/allure
        cp -r playwright-report pages/playwright
        cp line-report.txt pages/line.txt

    - name: Upload JUnit results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: junit-results
        path: test-results/results.xml

    - name: Upload line report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: line-report
        path: line-report.txt

    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() }}
      with:
        path: pages/

  publish-report:
    needs: run-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify-slack:
    needs: [run-tests, publish-report]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Download JUnit results
      uses: actions/download-artifact@v4
      with:
        name: junit-results
        path: test-results/

    - name: Send Slack notification
      env:
        CI: "true"
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        ALLURE_REPORT_URL: ${{ needs.publish-report.outputs.page_url }}allure/
        PW_REPORT_URL: ${{ needs.publish-report.outputs.page_url }}playwright/
        LINE_REPORT_URL: ${{ needs.publish-report.outputs.page_url }}line.txt
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: npm run slack
