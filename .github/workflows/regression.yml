name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: Install Allure CLI
      if: ${{ !cancelled() }}
      run: which allure || npm install -g allure@latest

    - name: Quality Gate
      if: ${{ !cancelled() }}
      run: allure quality-gate -c ./allure.config.mjs ./allure-results

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: allure generate -c ./allure.config.mjs ./allure-results -o ./allure-report

    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() }}
      with:
        path: allure-report/

  deploy:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
