name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: Install Allure CLI
      if: ${{ !cancelled() }}
      run: which allure || npm install -g allure@latest

    - name: Quality Gate
      if: ${{ !cancelled() }}
      run: allure quality-gate -c ./allure.config.mjs ./allure-results

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: allure generate -c ./allure.config.mjs ./allure-results -o ./allure-report

    - name: Upload JUnit results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: junit-results
        path: test-results/results.xml

    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() }}
      with:
        path: allure-report/

  deploy:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify:
    needs: [test, deploy]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Download JUnit results
      uses: actions/download-artifact@v4
      with:
        name: junit-results
        path: test-results/

    - name: Send Slack notification
      env:
        CI: "true"
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        ALLURE_REPORT_URL: ${{ needs.deploy.outputs.page_url }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: npm run slack
